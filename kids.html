<!DOCTYPE html>
<html lang="en">

<body class="kids fade-out">

<nav class="main-nav">
  <div class="nav-container">
    <div class="nav-logo"><a href="index.html">Voices</a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="stories.html">Stories</a>

  </div>
</nav>

<header class="kids-hero">
  <h1>Follow the Story Path 🫧</h1>
  <p>Click the bubbles to explore stories!</p>
</header>

<!-- BUBBLE PATH -->
<div class="bubble-path">

  <a href="stories/story1.html" class="bubble">1</a>

<footer class="site-footer">
  <p>© 2026 Voices of COVID-19 • Created by Jenny</p>
</footer>

<script>
document.body.classList.remove("fade-out");

// FUN FLOATING BUBBLES
document.querySelectorAll(".bubble").forEach(b => {
  b.addEventListener("mouseover", () => {
    b.style.transform = "scale(1.2)";
  });
  b.addEventListener("mouseout", () => {
    b.style.transform = "scale(1)";
  });
});
</script>

</body>
