<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Story Map</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="main-nav">
  <div class="nav-container">

    <!-- LOGO / TITLE -->
    <div class="nav-logo">
      <a href="index.html">Voices of COVID-19</a>
    </div>

    <!-- LINKS -->
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="stories.html">Stories</a>
      <a href="stories-map.html">Map</a>
      <a href="kids.html">Kids</a>
      <a href="share.html">Share</a>
      <a href="about.html">About</a>
    </div>

  </div>
</nav>

<header>
  <h1>Memory Map</h1>
  <p>Hover to preview, click to enter.</p>
</header>

<section class="map-grid">

  <a class="map-card" href="stories/story1.html" data-preview="Silence, isolation, early lockdown">
    <h2>Isolation</h2>
    <p>The silence of lockdown</p>
  </a>

  <a class="map-card" href="stories/story2.html" data-preview="Grief, hospitals, distance">
    <h2>Grief</h2>
    <p>Loss through screens</p>
  </a>

  <a class="map-card" href="stories/story3.html" data-preview="Recovery, rebuilding life">
    <h2>Recovery</h2>
    <p>Finding routine again</p>
  </a>

</section>

<section class="grid">

  <div class="card reveal">
    <h3>2020</h3>
    <p>Global lockdown begins</p>
  </div>

  <div class="card reveal">
    <h3>2021</h3>
    <p>Vaccines introduced worldwide</p>
  </div>

  <div class="card reveal">
    <h3>2022+</h3>
    <p>Long-term recovery begins</p>
  </div>

</section>

<div id="previewBox"></div>

<script>
const cards = document.querySelectorAll(".map-card");
const preview = document.getElementById("previewBox");

cards.forEach(card => {
  card.addEventListener("mouseenter", () => {
    preview.textContent = card.dataset.preview;
    preview.style.opacity = "1";
  });

  card.addEventListener("mouseleave", () => {
    preview.style.opacity = "0";
  });
});
</script>

</body>
</html>
